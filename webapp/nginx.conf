server {
    listen 80;
    server_name painel-admin.laetonline.org;

    # ADICIONE ISTO PARA RESOLVER NOMES DE DOMÍNIO!
    #resolver 1.1.1.1 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
    resolver 1.1.1.1;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass https://report-server-teste.laetonline.org/;
    proxy_ssl_verify off;
    proxy_ssl_server_name on;

    proxy_set_header Host report-server-teste.laetonline.org;
    proxy_set_header X-Real-IP $remote_addr;

    add_header 'Access-Control-Allow-Origin' 'https://painel-admin.laetonline.org' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    if ($request_method = OPTIONS) {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }
}
}